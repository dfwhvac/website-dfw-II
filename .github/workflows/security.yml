name: Security Audit

# Phase 1 P1.D items F8 (Dependabot+gitleaks) and F3d (yarn audit CI gate).
# Added Feb 28, 2026. Redesigned Sep 17, 2026 (weekly soft-fail).
#
# WHAT THIS GATES:
#   - yarn audit on every PR + main push: FAILS on high OR critical (production deps)
#   - Monday schedule: still runs yarn audit + gitleaks, but yarn findings soft-fail
#     and open/update a GitHub Issue (label security-audit) so main is not "red"
#     every time the advisory DB moves. Merge protection stays on PR/push.
#   - gitleaks on every PR + main push + schedule: blocks secret leaks
#
# WHY:
#   - F3d closes the dependency-vuln blind spot.
#   - F8 prevents the recurring "credential committed by accident" class of bug.
#   - Weekly advisory DB churn made fail-on-high cron look like broken main;
#     discovery stays, the red badge on schedule does not.

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 7 AM Central — discover advisories against pinned versions
    # even when no PR has been opened. Soft-fail yarn findings (see above).
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  yarn-audit:
    name: yarn audit (high + critical)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      critical: ${{ steps.parse.outputs.critical }}
      high: ${{ steps.parse.outputs.high }}
      has_blockers: ${{ steps.parse.outputs.has_blockers }}
      findings_json: ${{ steps.parse.outputs.findings_json }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Pin Yarn classic 1.22.22
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      # yarn audit resolves advisories from yarn.lock + the registry — it does
      # not require a full node_modules install. Skipping install avoids native
      # builds (sharp) and Mac-vs-Linux lockfile edge cases.
      - name: Run yarn audit
        run: |
          set +e
          yarn audit --json --groups dependencies > /tmp/yarn-audit.jsonl 2>/tmp/yarn-audit.err
          set -e
          if [ -s /tmp/yarn-audit.err ]; then
            echo "::group::yarn audit stderr"
            cat /tmp/yarn-audit.err
            echo "::endgroup::"
          fi

      - name: Parse yarn audit
        id: parse
        working-directory: .
        env:
          AUDIT_JSONL: /tmp/yarn-audit.jsonl
          # PR + push (and manual dispatch) remain hard gates. Monday schedule reports only.
          FAIL_ON_FINDINGS: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
        run: node scripts/parse-yarn-audit-ci.cjs

  security-audit-issue:
    name: open/update security-audit issue (schedule)
    needs: yarn-audit
    if: >-
      github.event_name == 'schedule' &&
      needs.yarn-audit.outputs.has_blockers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Upsert GitHub Issue
        uses: actions/github-script@v7
        env:
          FINDINGS_JSON: ${{ needs.yarn-audit.outputs.findings_json }}
          CRITICAL: ${{ needs.yarn-audit.outputs.critical }}
          HIGH: ${{ needs.yarn-audit.outputs.high }}
        with:
          script: |
            const critical = process.env.CRITICAL || '0'
            const high = process.env.HIGH || '0'
            let findings = []
            try {
              findings = JSON.parse(process.env.FINDINGS_JSON || '[]')
            } catch (_) {
              findings = []
            }
            const label = 'security-audit'
            const title = `Security Audit: ${high} high / ${critical} critical production advisories`
            const rows = findings.length
              ? findings.map((f) =>
                  `| ${f.severity} | \`${f.module}\` | ${f.vulnerable} | ${f.patched} | ${f.ghsa} | \`${f.path || ''}\` |`
                ).join('\n')
              : '| _(see Actions log)_ | | | | | |'
            const body = [
              '## Weekly Security Audit findings',
              '',
              'Monday cron discovered high/critical production advisories against the current lockfile.',
              '**PR/push merges remain blocked** until these are fixed. This issue is the ops queue — the schedule workflow itself does not fail.',
              '',
              `Counts: **${high} high**, **${critical} critical**.`,
              '',
              '### Fix order (parent bump first)',
              '1. Bump the direct package if it already pulls a fixed transitive (`sanity`, `next`, …).',
              '2. Only then add a time-boxed Yarn `resolutions` pin + CHANGELOG note.',
              '3. Merge Dependabot version PRs after the advisory is cleared.',
              '',
              'See `memory/FOUNDATION_AUDIT_PROGRAM.md` (Security Audit playbook).',
              '',
              '| Severity | Module | Vulnerable | Patched | GHSA | Path |',
              '|---|---|---|---|---|---|',
              rows,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
            ].join('\n')

            await github.rest.issues.getLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
            }).catch(async () => {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'B60205',
                description: 'Weekly yarn audit high/critical findings',
              })
            })

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            })
            const existing = issues.data.find((i) =>
              i.title.startsWith('Security Audit:')
            )
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              })
              core.notice(`Updated issue #${existing.number}`)
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              })
              core.notice(`Opened issue #${created.data.number}`)
            }

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
