name: Security Audit

# Phase 1 P1.D items F8 (Dependabot+gitleaks) and F3d (yarn audit CI gate).
# Added Feb 28, 2026.
#
# WHAT THIS GATES:
#   - yarn audit on every PR + main push: fails on high OR critical (production deps)
#   - gitleaks on every PR + main push: blocks secret leaks before they merge
#
# WHY:
#   - F3d closes the dependency-vuln blind spot. Apr 21, 2026 baseline: 28 high on
#     Sanity 3.x Studio subtree. Sanity 5.26+ (May 2026) should clear most — this gate
#     re-verifies weekly; KPI dashboard row dependency-vulns-prod mirrors these counts.
#   - F8 prevents the recurring "credential committed by accident" class of bug.
#     Site has 6+ third-party API keys (Sanity, Resend, Google Places, reCAPTCHA,
#     Google Auth, Vercel) — secret-leak detection is non-optional.

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 7 AM Central — catches advisories disclosed against pinned versions
    # even when no PR has been opened.
    - cron: "0 13 * * 1"
  # Manual on-demand trigger — Actions tab → Security Audit → "Run workflow" button.
  # Useful for ad-hoc audits after rotating secrets or before a deploy.
  workflow_dispatch:

jobs:
  yarn-audit:
    name: yarn audit (high + critical)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          # NOTE: yarn cache deliberately disabled here. It's a nice-to-have
          # (saves ~30s per run) that turned into a brittle dependency-path
          # configuration. Audit + install completes in ~60s without it.
          # Re-enable later only if CI duration becomes a real bottleneck.

      - name: Install dependencies
        # Audit only needs a resolved tree from yarn.lock — skip native builds
        # (canvas/sharp) that often fail on bare ubuntu runners and wrongly trip
        # the frozen-lockfile fallback (which then regenerates a dirtier lockfile).
        run: |
          set +e
          yarn install --frozen-lockfile --ignore-scripts
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::yarn.lock out of sync with package.json (frozen-lockfile failed). Update yarn.lock locally; do not regenerate in CI."
            exit 1
          fi

      # yarn 1's `--level` flag has known bugs in exit-code reporting (it can
      # exit non-zero on lower-severity advisories even when no critical ones
      # exist — we observed exit code 14 = high+moderate+low, not critical).
      #
      # Count only auditAdvisory.severity via node JSON parse (not grep) so
      # summary lines / nested fields cannot false-positive.
      - name: Run yarn audit
        run: |
          set +e
          yarn audit --json --groups dependencies > /tmp/yarn-audit.jsonl 2>/tmp/yarn-audit.err
          set -e
          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('/tmp/yarn-audit.jsonl', 'utf8').split('\n').filter(Boolean);
          let critical = 0, high = 0, moderate = 0;
          const samples = [];
          for (const line of lines) {
            let o;
            try { o = JSON.parse(line); } catch { continue; }
            if (o.type !== 'auditAdvisory') continue;
            const sev = o.data && o.data.advisory && o.data.advisory.severity;
            if (sev === 'critical') {
              critical += 1;
              if (samples.length < 20) samples.push(line);
            } else if (sev === 'high') {
              high += 1;
              if (samples.length < 20) samples.push(line);
            } else if (sev === 'moderate') {
              moderate += 1;
            }
          }
          console.log(`Production dependency advisories: critical=${critical} high=${high} moderate=${moderate}`);
          if (critical > 0 || high > 0) {
            for (const s of samples) console.log(s);
            console.error(`::error::yarn audit: ${critical} critical + ${high} high in production dependencies. Run 'cd frontend && yarn audit --groups dependencies' locally.`);
            process.exit(1);
          }
          console.log(`::notice::yarn audit clean of high/critical production advisories (moderate=${moderate} allowed).`);
          NODE

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed for proper diff scan

      - name: Run gitleaks
        # NOTE (May 11, 2026): gitleaks-action@v2 still runs on Node 20.
        # GitHub forces Node 24 on June 2, 2026. Upstream v3 release pending —
        # bump this pin once https://github.com/gitleaks/gitleaks-action/releases
        # publishes a Node 24-compatible tag. See RECURRING_MAINTENANCE.md → AH1.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default ruleset covers AWS, GCP, Azure, Stripe, Slack, GitHub PAT,
          # private SSH keys, generic high-entropy strings. Sufficient for this
          # repo's threat model.
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
